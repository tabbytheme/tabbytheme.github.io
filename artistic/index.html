<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.css" rel="stylesheet">
    <!-- Theme CSS -->
    <link href="css/style.css" rel="stylesheet">

    <title>Troyee International</title>
</head>

<body class="hca satisfy-regular">
    <div class="tabby-wrap">
        <span class="hca-lg-img">
            <img class="hca-img" src="images/artistic_watercolor_background.jpg" class="tb-hcc-img" alt="Responsive image" />
        </span>
        <span class="hca-sm-img">
            <img class="hca-img" src="images/artistic_watercolor_background.jpg" class="tb-hcc-img" alt="Responsive image" />
        </span>
        <span class="hca-exsm-img">
            <img class="hca-img" src="images/artistic_watercolor_background.jpg" class="tb-hcc-img" alt="Responsive image" />
        </span>
        <div class="hca-container">
            <div class="hca-logo">
                <a href="index.html">Troyee<img src="images/logo.png" class="img-fluid" /></a>
            </div>
            <div class="hca-block">
                <div class="d-flex justify-content-between hca-counter">
                    <div class="h-block">
                        <b class=" hours"></b>
                        <span>Hours</span>
                    </div>
                    <div class="m-block">
                        <b class="minutes"></b>
                        <span>Minutes</span>
                    </div>
                    <div class="s-block">
                        <b class="seconds"></b>
                        <span>Seconds</span>
                    </div>
                </div>
                <h1 class="hca-title">We Are <br /> Coming Soon</h1>
                <p class="hca-text">We're working on our new website! <br /> we will be ready in:</p>
            </div>
        </div>
    </div>    
    <!-- Bootstrap Bundle -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- Moment JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/moment-duration-format/2.3.2/moment-duration-format.min.js"></script>
    <!-- Custom Js -->
    <script>
        const intValue = "Oct 15 2026";
        const initDate = new Date(intValue);

        const hourTarget = document.querySelector(".hours");
        const minuteTarget = document.querySelector(".minutes");
        const secondTarget = document.querySelector(".seconds");

        function getDiff(targetDate) {
            const initDate = moment(targetDate);
            const currentDate = moment(new Date());

            var ms = moment(initDate, "DD/MM/YYYY HH:mm:ss").diff(
                moment(currentDate, "DD/MM/YYYY HH:mm:ss")
            );
            var d = moment.duration(ms);
            var s = Math.floor(d.asHours()) + moment.utc(ms).format(":mm:ss");

            const [hours, minutes, seconds] = s?.split(":");

            hourTarget.innerText = hours;
            minuteTarget.innerText = minutes;
            secondTarget.innerText = seconds;
        }

        // final call
        getDiff(initDate);

        // run after each second
        setInterval(() => getDiff(initDate), 1000);
    </script>

</body>

</html>
